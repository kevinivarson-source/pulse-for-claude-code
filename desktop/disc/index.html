<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Pulse Disc</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent;color:#e8ebf1;font:13px/1.3 "Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none;cursor:default}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.title{position:fixed;left:50%;top:46px;transform:translateX(-50%);max-width:150px;box-sizing:border-box;padding:4px 10px;border-radius:999px;background:rgba(11,15,23,.88);border:1px solid #253042;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .18s;pointer-events:none}
.hud{position:fixed;left:50%;top:158px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;opacity:0;transition:opacity .18s;pointer-events:none}
body.hover .title,body.hover .hud,body:focus-within .hud{opacity:1}
body.hover .hud,body:focus-within .hud{pointer-events:auto}
button{width:44px;height:44px;border-radius:50%;border:1px solid #253042;background:rgba(24,32,45,.94);color:#e8ebf1;display:grid;place-items:center;padding:0;cursor:pointer}
button.main{width:48px;height:48px;border:0;background:#e8ebf1;color:#0b0f17}
button svg{width:18px;height:18px}button.main svg{width:20px;height:20px}
button:focus-visible{outline:2px solid #5aa2ff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.title,.hud{transition:none}}
</style>
</head>
<body>
<canvas id="disc" role="img" aria-label="Pulse: the playing track as a ring of notes"></canvas>
<div class="title" id="title"></div>
<div class="hud">
  <button type="button" class="main" id="play" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path id="playIcon" d="M7 4.5v15l13-7.5z"/></svg></button>
  <button type="button" id="next" aria-label="Next track"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
</div>
<script type="module" src="disc.js"></script>
</body>
</html>
